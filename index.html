<!DOCTYPE html>
<html lang="en">
<head>

    <title>Stacey Xu's Portfolio</title>
    <link rel="stylesheet" href="style.css">

<header>
    

    <div class="menu">
    <button class="img-btn left-btn" onclick="handleClick()">

    <button class="img-btn" onclick="handleClick()">
  
        <img src="images/illustrations button.png" alt="illustrations">

     <button class="img-btn" onclick="handleClick()">

    </button>

    <button class="img-btn" onclick="handleClick()">

    <style>
 .img-btn {
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
 
}

  .img-btn img {
    width: 200px;         
    display: block;
  }
  .img-btn:hover img {
    filter: brightness(1.15);   
  }
  .img-btn:active img {
    transform: scale(0.95);    
  }

  .menu{
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }

  .left-btn {
   
    margin-right: auto; 
  }
  
</style>

<script>
  function handleClick() {
    alert("Button clicked!");   / replace with what you want it to do */
  }
</script>
